services:
  garo-smart-charging:
    build: .
    container_name: garo-smart-charging
    ports:
      - "5000:5000"
    environment:
      - GARO_URL=${GARO_URL}
      - PRICE_AREA=${PRICE_AREA:-SE3}
      - CHARGING_HOURS=${CHARGING_HOURS:-7}
      - DEPARTURE_HOUR=${DEPARTURE_HOUR:-7}
      - TZ=Europe/Stockholm
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
